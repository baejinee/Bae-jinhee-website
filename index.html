<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bae Jin Hee</title>
<meta name="description" content="배진희 Bae Jin Hee — 유리, 빛, 공간을 통한 감각적 이미지의 탐구">
<meta name="theme-color" content="#0A0A0C">
<meta property="og:title" content="Bae Jin Hee">
<meta property="og:description" content="유리, 빛, 공간을 통한 감각적 이미지의 탐구">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<link rel="stylesheet" href="style.css">
</head>
<body data-lang="ko">

<div class="lumen glow" id="lumenGlow" aria-hidden="true"></div>
<div class="lumen cast" id="lumenCast" aria-hidden="true"></div>
<div class="lumen-core" id="lumenCore" aria-hidden="true"></div>

<header class="bar" id="bar">
  <div class="wrap bar-in">
    <a class="bar-name" href="#top">BAE JIN HEE</a>
    <nav class="bar-nav" id="barNav"></nav>
    <div class="langsw">
      <button type="button" data-set="ko">KO</button><i>/</i><button type="button" data-set="en">EN</button>
    </div>
  </div>
</header>

<main id="top">

  <!-- 첫 화면 — 언어 선택 -->
  <section class="enter">
    <div class="wrap enter-in">
      <div class="enter-mid">
        <div>
          <h1 class="enter-name" id="enterName"></h1>
          <div class="gate" id="gate">
            <button type="button" data-set="ko">한국어</button>
            <s>/</s>
            <button type="button" data-set="en">English</button>
          </div>
          <p class="enter-line" id="enterLine"></p>
        </div>
      </div>
      <div class="enter-foot">
        <div class="lab" id="enterMeta"></div>
        <a class="scroll-cue lab" href="#about" id="enterCue"></a>
      </div>
    </div>
  </section>

  <!-- 소개 -->
  <section id="about">
    <div class="wrap">
      <div class="sec-head"><h2 id="aboutH"></h2><span class="lab" id="aboutMeta"></span></div>
      <div class="about-grid">
        <figure class="about-portrait" id="portrait" style="margin:0"></figure>
        <div id="aboutText"></div>
      </div>
    </div>
  </section>

  <!-- 작품 -->
  <section id="works">
    <div class="wrap">
      <div class="sec-head"><h2 id="worksH"></h2><span class="lab" id="worksMeta"></span></div>
      <nav class="series-nav" id="seriesNav"></nav>
      <div id="seriesWrap"></div>
    </div>
  </section>

  <!-- 건축 공간 -->
  <section id="projects">
    <div class="wrap">
      <div class="sec-head"><h2 id="projH"></h2><span class="lab" id="projMeta"></span></div>
      <p class="series-note" id="projNote"></p>
      <div class="proj-grid" id="projGrid"></div>
    </div>
  </section>

  <!-- 협업 -->
  <section id="collab">
    <div class="wrap">
      <div class="sec-head"><h2 id="colH"></h2><span class="lab" id="colMeta"></span></div>
      <p class="series-note" id="colNote"></p>
      <div class="collab-grid" id="colGrid"></div>
    </div>
  </section>

  <!-- 이력 -->
  <section id="cv">
    <div class="wrap">
      <div class="sec-head"><h2 id="cvH"></h2><span class="lab" id="cvBorn"></span></div>
      <div class="cv" id="cvBody"></div>
    </div>
  </section>

  <!-- 연락처 -->
  <section id="contact">
    <div class="wrap">
      <div class="sec-head"><h2 id="contactH"></h2><span class="lab"></span></div>
      <div class="contact-grid">
        <div>
          <p class="contact-intro" id="cIntro"></p>
          <div class="contact-list" id="cList"></div>
        </div>

        <form class="form" id="mailForm" novalidate>
          <div class="two">
            <div class="field"><label for="f-name" id="lb-name"></label>
              <input id="f-name" type="text" autocomplete="name" required></div>
            <div class="field"><label for="f-email" id="lb-email"></label>
              <input id="f-email" type="email" autocomplete="email" required></div>
          </div>
          <div class="field"><label for="f-subject" id="lb-subject"></label>
            <input id="f-subject" type="text"></div>
          <div class="field"><label for="f-message" id="lb-message"></label>
            <textarea id="f-message" required></textarea></div>
          <button class="form-send" type="submit" id="sendBtn"></button>
          <p class="form-note" id="formNote" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>

</main>

<footer class="foot-outer"><div class="wrap foot lab" id="foot"></div></footer>

<!-- 상세 보기 -->
<div class="view" id="view" role="dialog" aria-modal="true" aria-label="Work detail">
  <span class="view-count" id="viewCount"></span>
  <button class="view-x" id="viewX">CLOSE</button>
  <button class="view-nav view-prev" id="viewPrev" aria-label="prev">←</button>
  <button class="view-nav view-next" id="viewNext" aria-label="next">→</button>
  <div class="view-in" id="viewIn"></div>
</div>

<noscript><div class="wrap" style="padding:80px 0">이 페이지는 자바스크립트로 내용을 불러옵니다. / Please enable JavaScript.</div></noscript>

<script src="data.js"></script>
<script>
/* ==========================================================================
   화면을 그리고 빛을 다루는 부분입니다. 수정할 일은 거의 없습니다.
   내용을 바꾸시려면 data.js 를 여세요. (또는 편집기.html)
   ========================================================================== */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── 화면에 쓰는 낱말들 (내용이 아니라 버튼·제목 같은 것) ────────── */
  var UI = {
    ko: { about:'소개', works:'작품', projects:'건축 공간', collab:'협업',
          cv:'이력', contact:'연락처', views:'전시 전경', scroll:'아래로',
          name:'이름', email:'이메일', subject:'제목', message:'메시지',
          send:'보내기', more:'장 더 보기',
          fill:'이름, 이메일, 메시지를 채워 주세요.',
          sending:'보내는 중…',
          sent:'메시지가 전송되었습니다. 확인 후 회신 드리겠습니다.',
          failed:'전송에 실패했습니다. 아래 주소로 직접 보내주세요 — ',
          mailapp:'메일 앱이 열립니다.',
          studio:'스튜디오', pdf:'포트폴리오 내려받기', top:'맨 위로',
          inquiry:'문의' },
    en: { about:'About', works:'Works', projects:'Architectural Space', collab:'Collaborations',
          cv:'CV', contact:'Contact', views:'Installation views', scroll:'Scroll',
          name:'Name', email:'Email', subject:'Subject', message:'Message',
          send:'Send', more:' more',
          fill:'Please fill in name, email, and message.',
          sending:'Sending…',
          sent:'Your message has been sent.',
          failed:'Sending failed. Please write directly to — ',
          mailapp:'Opening your mail app.',
          studio:'Studio', pdf:'Download portfolio', top:'Top',
          inquiry:'Inquiry' }
  };

  var L = 'ko';                       // 현재 언어
  var T = UI.ko;

  /* ko/en 을 가진 값에서 현재 언어를 꺼냅니다. 비어 있으면 다른 쪽으로 대신합니다. */
  function t(o) {
    if (o == null) return '';
    if (typeof o === 'string') return o;
    return (o[L] && String(o[L]).trim()) ? o[L] : (o[L === 'ko' ? 'en' : 'ko'] || '');
  }
  /* 크기 — '가변크기' 는 영문에서 'dimensions variable' 로 */
  function size(s) {
    if (!s) return '';
    return L === 'en' ? String(s).replace(/가변\s*크기/g, 'dimensions variable') : s;
  }
  /* 작품 제목 — 국문에서는 국문 제목이 있으면 그것을, 없으면 영문 제목을 */
  function title(w) {
    if (L === 'ko' && w.ko && w.ko.trim()) return w.ko;
    return w.title || w.ko || '';
  }

  function placeholder(label) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">' +
      '<rect width="100%" height="100%" fill="#DCDCD8"/>' +
      '<text x="400" y="408" text-anchor="middle" font-family="Pretendard, sans-serif" ' +
      'font-size="22" letter-spacing="4" fill="#8D8E88">' + esc(label) + '</text></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  var FB = placeholder('IMAGE');

  function imgTag(src, alt, extra) {
    return '<img src="' + esc(src || FB) + '" alt="' + esc(alt) + '" ' +
           (extra == null ? 'loading="lazy"' : extra) +
           ' draggable="false" onerror="this.onerror=null;this.src=\'' + FB + '\'">' +
           '<span class="shield"></span>';
  }
  function shots(o) {                 // 옛 방식(image:'...') 도 받아줍니다
    if (o.images && o.images.length) return o.images;
    return o.image ? [o.image] : [];
  }

  var ITEMS = [];                     // 상세 보기 목록
  function add(o) { ITEMS.push(o); return ITEMS.length - 1; }

  /* ══ 전체 그리기 ═══════════════════════════════════════════════════ */
  function draw() {
    T = UI[L];
    ITEMS = [];
    document.body.setAttribute('data-lang', L);
    document.documentElement.lang = L;

    /* 상단 메뉴 */
    $('barNav').innerHTML =
      ['about','works','projects','collab','cv','contact']
        .filter(function (k) {
          if (k === 'collab') return SITE.collab && SITE.collab.items && SITE.collab.items.length;
          return true;
        })
        .map(function (k) { return '<a href="#' + k + '">' + esc(T[k]) + '</a>'; }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.langsw button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-set') === L);
    });

    /* 첫 화면 */
    $('enterName').textContent = SITE.entrance.name;
    $('enterLine').textContent = t(SITE.entrance.line);
    $('enterMeta').textContent = SITE.meta.span + '   ·   ' + t(SITE.meta.media);
    $('enterCue').innerHTML = esc(T.scroll) + ' &nbsp;<i></i>';

    /* 소개 */
    var A = SITE.about;
    $('aboutH').textContent = t(A.heading);
    $('aboutMeta').textContent = t(SITE.meta.role);
    $('portrait').innerHTML = imgTag(A.portrait, t(SITE.meta.name));
    $('aboutText').innerHTML = A.paragraphs.map(function (p) {
      return '<p class="about-p">' + esc(t(p)) + '</p>';
    }).join('');

    /* 작품 */
    $('worksH').textContent = T.works;
    $('worksMeta').textContent = SITE.meta.span;
    $('seriesNav').innerHTML = SITE.series.map(function (s) {
      return '<a href="#s-' + esc(s.id) + '">' + esc(t(s)) + '</a>';
    }).join('');

    $('seriesWrap').innerHTML = SITE.series.map(function (s) {
      var works = s.works.map(function (w) {
        var pics = shots(w);
        var i = add({
          head: title(w), images: pics,
          line: [w.medium, size(w.size), w.year].filter(Boolean).join(', ')
        });
        return '<button class="thumb" data-i="' + i + '">' +
          '<span class="thumb-img">' + imgTag(pics[0], title(w)) +
            (pics.length > 1 ? '<span class="thumb-n">+' + (pics.length - 1) + '</span>' : '') +
          '</span>' +
          '<span class="thumb-cap">' +
            '<span class="thumb-t">' + esc(title(w)) + '</span>' +
            '<span class="thumb-y">' + esc(w.year) + '</span>' +
          '</span>' +
        '</button>';
      }).join('');

      var views = '';
      if (s.views && s.views.length) {
        views = '<div class="views">' +
          '<div class="views-h"><span class="lab">' + esc(T.views) + '</span></div>' +
          '<div class="views-grid">' + s.views.map(function (v) {
            var cap = t(v.caption);
            var i = add({ head: t(s), images: [v.image], line: cap });
            return '<button class="viewshot" data-i="' + i + '">' +
              '<span class="viewshot-img">' + imgTag(v.image, cap) + '</span>' +
              '<span class="c">' + esc(cap) + '</span>' +
            '</button>';
          }).join('') + '</div></div>';
      }

      return '<div class="series" id="s-' + esc(s.id) + '">' +
        '<div class="series-head"><h3>' + esc(t(s)) + '</h3>' +
          '<span class="lab">' + esc(s.years) + '</span></div>' +
        '<p class="series-note">' + esc(t(s.note)) + '</p>' +
        '<div class="thumbs">' + works + '</div>' + views +
      '</div>';
    }).join('');

    /* 건축 공간 · 협업 */
    cards(SITE.projects, 'proj', 'projects');
    cards(SITE.collab, 'col', 'collab', 'collab');

    /* 이력 */
    var B = SITE.bio;
    $('cvH').textContent = t(B.heading);
    $('cvBorn').textContent = t(B.born);
    $('cvBody').innerHTML = B.cv.map(function (b) {
      return '<div class="cv-block">' +
        '<div class="cv-h"><span class="lab">' + esc(t(b.heading)) + '</span></div>' +
        b.items.map(function (it) {
          var body = esc(t(it));
          if (it.url) {
            body = '<a class="ext" href="' + esc(it.url) + '" target="_blank" rel="noopener">' + body + '</a>';
          }
          if (it.sub && t(it.sub)) body += '<span class="sub">' + esc(t(it.sub)) + '</span>';
          return '<div class="cv-row"><span class="cv-y">' + esc(it.year) + '</span>' +
                 '<span class="cv-t">' + body + '</span></div>';
        }).join('') + '</div>';
    }).join('');

    /* 연락처 */
    var c = SITE.contact;
    $('contactH').textContent = T.contact;
    $('cIntro').textContent = t(c.intro);
    var rows = [];
    if (c.email) rows.push('<a href="mailto:' + esc(c.email) + '"><span>' + esc(c.email) + '</span><span class="lab">Email</span></a>');
    if (c.instagram) rows.push('<a href="https://instagram.com/' + esc(c.instagram) + '" target="_blank" rel="noopener"><span>@' + esc(c.instagram) + '</span><span class="lab">Instagram</span></a>');
    if (c.phone) rows.push('<a href="tel:' + esc(c.phone.replace(/[^+\d]/g, '')) + '"><span>' + esc(c.phone) + '</span><span class="lab">Tel</span></a>');
    if (c.portfolio) rows.push('<a href="' + esc(c.portfolio) + '" download><span>' + esc(T.pdf) + '</span><span class="lab">PDF</span></a>');
    rows.push('<span><span>' + esc(t(SITE.meta.studio)) + '</span><span class="lab">' + esc(T.studio) + '</span></span>');
    $('cList').innerHTML = rows.join('');

    $('lb-name').textContent = T.name;
    $('lb-email').textContent = T.email;
    $('lb-subject').textContent = T.subject;
    $('lb-message').textContent = T.message;
    $('sendBtn').textContent = T.send;

    $('foot').innerHTML =
      '<span>© ' + new Date().getFullYear() + ' ' + esc(SITE.meta.name.en) + '</span>' +
      '<a href="#top">' + esc(T.top) + '</a>';

    watchRise();
  }

  /* 건축 공간 · 협업 — 같은 모양의 카드 구역 */
  function cards(D, pre, secId, cls) {
    cls = cls || pre;
    var sec = $(secId);
    if (!D || !D.items || !D.items.length) { if (sec) sec.style.display = 'none'; return; }
    if (sec) sec.style.display = '';
    $(pre + 'H').textContent = t(D.heading);
    $(pre + 'Meta').textContent = D.items.length + '';
    $(pre + 'Note').textContent = t(D.note);
    $(pre + 'Grid').innerHTML = D.items.map(function (w) {
      var pics = shots(w);
      var place = t(w.place);
      var i = add({ head: title(w), images: pics,
                    line: [place, w.year].filter(Boolean).join(', ') });
      return '<button class="' + cls + '" data-i="' + i + '">' +
        '<span class="' + cls + '-img">' + imgTag(pics[0], title(w)) +
          (pics.length > 1 ? '<span class="thumb-n">+' + (pics.length - 1) + '</span>' : '') + '</span>' +
        '<span class="' + cls + '-cap">' +
          '<span class="' + cls + '-t">' + esc(title(w)) +
            '<span class="y">' + esc(w.year) + '</span></span>' +
          '<span class="' + cls + '-p">' + esc(place) + '</span>' +
        '</span>' +
      '</button>';
    }).join('');
  }

  /* 스크롤하면 하나씩 떠오릅니다 */
  var io = null;
  function watchRise() {
    var rise = document.querySelectorAll('.thumb, .proj, .collab');
    if (!('IntersectionObserver' in window)) {
      Array.prototype.forEach.call(rise, function (t) { t.classList.add('is-in'); });
      return;
    }
    if (io) io.disconnect();
    io = new IntersectionObserver(function (es) {
      es.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.04 });
    Array.prototype.forEach.call(rise, function (t) { io.observe(t); });
  }

  /* ══ 언어 고르기 ═══════════════════════════════════════════════════ */
  function reveal() {
    $('gate').classList.add('is-gone');
    $('enterLine').classList.add('is-in');
    $('enterCue').classList.add('is-in');
  }
  function setLang(v, first) {
    L = (v === 'en') ? 'en' : 'ko';
    try { localStorage.setItem('bjh-lang', L); } catch (e) {}
    draw();
    if (!first) reveal();
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-set]');
    if (b) { setLang(b.getAttribute('data-set')); }
  });

  var saved = null;
  try { saved = localStorage.getItem('bjh-lang'); } catch (e) {}
  L = (saved === 'en') ? 'en' : 'ko';
  draw();
  if (saved) { reveal(); }             // 전에 고른 적이 있으면 바로 넘어갑니다

  /* ══ 메일 보내기 ═══════════════════════════════════════════════════ */
  var form = $('mailForm'), noteEl = $('formNote'), btn = $('sendBtn');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var c = SITE.contact;
    var d = { name: $('f-name').value.trim(), email: $('f-email').value.trim(),
              subject: $('f-subject').value.trim(), message: $('f-message').value.trim() };
    if (!d.name || !d.email || !d.message) { noteEl.textContent = T.fill; return; }
    var subject = d.subject || ('[' + T.inquiry + '] ' + d.name);
    if (c.formEndpoint) {
      btn.disabled = true; noteEl.textContent = T.sending;
      fetch(c.formEndpoint, {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: d.name, email: d.email, _subject: subject, message: d.message })
      }).then(function (r) {
        if (!r.ok) throw new Error('failed');
        form.reset(); noteEl.textContent = T.sent;
      }).catch(function () {
        noteEl.textContent = T.failed + c.email;
      }).then(function () { btn.disabled = false; });
    } else {
      location.href = 'mailto:' + c.email + '?subject=' + encodeURIComponent(subject) +
        '&body=' + encodeURIComponent(d.message + '\n\n—\n' + d.name + ' · ' + d.email);
      noteEl.textContent = T.mailapp;
    }
  });

  /* ══ 스크롤에 따라 빛이 들어옵니다 ═════════════════════════════════ */
  var root = document.documentElement, cs = getComputedStyle(root);
  function rgb(n) {
    var h = cs.getPropertyValue(n).trim().replace('#', '');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  var PAL = ['bg', 'ink', 'soft', 'mute'].map(function (k) {
    return { key: k, a: rgb('--night-' + k), b: rgb('--day-' + k) };
  });
  var glow = $('lumenGlow'), cast = $('lumenCast'), core = $('lumenCore'), bar = $('bar');
  var touch = !matchMedia('(hover: hover)').matches;

  /* 빛이 차오르는 거리. 손가락으로 넘기면 한 번에 훅 지나가 버리므로
     모바일에서는 더 길게 잡습니다. */
  var SPAN = touch ? 2.4 : 1.5;
  var mix = 0, aim = 0, painted = -1;

  function paintColors(e) {
    if (Math.abs(e - painted) < 0.003) return;
    painted = e;
    PAL.forEach(function (col) {
      var v = col.a.map(function (n, i) { return Math.round(n + (col.b[i] - n) * e); });
      root.style.setProperty('--' + col.key, 'rgb(' + v.join(',') + ')');
    });
  }

  /* 커서 — 유리를 통과한 빛 하나가 끝까지 따라옵니다 */
  var cx = 0, cy = 0, tx = 0, ty = 0, want = 0, here = 0, seen = false;
  var kx = 0, ky = 0;                 // 빛의 중심 (커서에 더 가깝게 붙습니다)
  if (!reduced && !touch) {
    document.documentElement.classList.add('has-lumen');
    tx = cx = kx = innerWidth / 2; ty = cy = ky = innerHeight / 2;
    addEventListener('pointermove', function (e) {
      tx = e.clientX; ty = e.clientY;
      if (!seen) { seen = true; cx = tx; cy = ty; }
      want = 1;
    }, { passive: true });
    document.addEventListener('mouseleave', function () { want = 0; });
  }

  /* 한 개의 루프가 빛과 커서를 모두 맡습니다.
     iOS 는 관성 스크롤 도중 scroll 이벤트를 띄엄띄엄 주기 때문에
     스크롤 위치를 매 프레임 직접 읽습니다. */
  (function loop() {
    var h = window.innerHeight;
    var p = Math.min(1, Math.max(0, window.scrollY / (h * SPAN)));
    aim = p * p * (3 - 2 * p);
    mix += (aim - mix) * 0.12;
    if (Math.abs(aim - mix) < 0.002) mix = aim;
    paintColors(mix);
    bar.classList.toggle('is-on', window.scrollY > h * 0.7);

    if (!reduced && !touch) {
      cx += (tx - cx) * 0.11; cy += (ty - cy) * 0.11;   // 번지는 빛 — 살짝 늦게
      kx += (tx - kx) * 0.38; ky += (ty - ky) * 0.38;   // 빛의 중심 — 바짝 붙어서
      here += (want - here) * 0.08;
      var m = 'translate3d(' + cx.toFixed(1) + 'px,' + cy.toFixed(1) + 'px,0)';
      /* 밝아진 뒤에도 번지는 빛을 조금 남겨 두면 계속 '빛'으로 읽힙니다 */
      glow.style.transform = m; glow.style.opacity = (here * (1 - mix * 0.72)).toFixed(3);
      cast.style.transform = m; cast.style.opacity = (here * mix).toFixed(3);
      core.style.transform = 'translate3d(' + kx.toFixed(1) + 'px,' + ky.toFixed(1) + 'px,0)';
      core.style.opacity = here.toFixed(3);
    }
    requestAnimationFrame(loop);
  })();

  /* ══ 상세 보기 ═════════════════════════════════════════════════════ */
  var view = $('view'), viewIn = $('viewIn'), vCount = $('viewCount'), at = 0;

  function render() {
    var w = ITEMS[at];
    var pics = w.images.length ? w.images : [FB];
    viewIn.innerHTML =
      '<div class="view-frame">' + imgTag(pics[0], w.head, '') + '</div>' +
      '<div class="view-cap">' +
        '<span class="t">' + esc(w.head) + '</span>' +
        '<span class="m">' + esc(w.line) + ' &nbsp;·&nbsp; © Bae Jin Hee</span>' +
      '</div>' +
      (pics.length > 1
        ? '<div class="view-hint">' + (pics.length - 1) + ' ' + esc(T.more) + '</div>' +
          '<div class="view-more">' + pics.slice(1).map(function (p) {
              return '<figure>' + imgTag(p, w.head) + '</figure>';
            }).join('') + '</div>'
        : '');
    vCount.textContent = pad(at + 1) + ' / ' + pad(ITEMS.length);
    view.scrollTop = 0;
  }
  function openAt(i) {
    at = i; render();
    view.classList.add('is-open'); document.body.classList.add('is-locked');
  }
  function step(d) { at = (at + d + ITEMS.length) % ITEMS.length; render(); }
  function close() { view.classList.remove('is-open'); document.body.classList.remove('is-locked'); }

  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    var b = e.target.closest('.thumb, .viewshot, .proj, .collab');
    if (b) { openAt(+b.getAttribute('data-i')); return; }
    if (e.target === view || e.target === viewIn) close();
  });
  $('viewX').addEventListener('click', close);
  $('viewPrev').addEventListener('click', function (e) { e.stopPropagation(); step(-1); });
  $('viewNext').addEventListener('click', function (e) { e.stopPropagation(); step(1); });
  addEventListener('keydown', function (e) {
    if (!view.classList.contains('is-open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  /* ══ 이미지 보호 ═══════════════════════════════════════════════════ */
  /* 완벽한 차단은 불가능하지만, 손쉬운 저장·복사는 막습니다. */
  document.addEventListener('contextmenu', function (e) {
    if (e.target.closest('.thumb-img, .viewshot-img, .proj-img, .collab-img, .view-frame, .view-more, .about-portrait')) {
      e.preventDefault();
    }
  });
  document.addEventListener('dragstart', function (e) {
    if (e.target.tagName === 'IMG') e.preventDefault();
  });
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === 's' || k === 'u' || k === 'p')) e.preventDefault();
  });
})();
</script>
</body>
</html>
