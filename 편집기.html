<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈페이지 편집기 — Bae Jin Hee</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F4F4F2; --card:#fff; --ink:#191A1D; --soft:#55564F; --mute:#8C8D86;
  --line:#DFDFD9; --hair:#EDEDE8; --accent:#2B4A6F; --warn:#9B3A2E; --ok:#2F6B4F;
  --sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}

/* ── 위쪽 고정 막대 ─────────────────────────────────────────── */
header{position:sticky;top:0;z-index:30;background:rgba(244,244,242,.95);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hin{max-width:1180px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hin h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.02em}
.hin .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:8px 15px;border-radius:8px;font:inherit;font-size:13.5px;cursor:pointer;
  transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{opacity:.87}
.btn.mini{padding:3px 9px;font-size:12px;border-radius:6px;color:var(--soft)}
.btn.mini:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--warn);border-color:#E3CFCB}
.btn.danger:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
nav.jump{max-width:1180px;margin:0 auto;padding:0 22px 9px;display:flex;gap:5px;flex-wrap:wrap}
nav.jump a{font-size:13px;color:var(--mute);padding:5px 10px;border-radius:7px;text-decoration:none}
nav.jump a:hover{background:var(--hair);color:var(--ink)}

main{max-width:1180px;margin:0 auto;padding:24px 22px 130px}

/* ── 구역 ───────────────────────────────────────────────────── */
section{margin-bottom:34px;scroll-margin-top:112px}
.sh{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.sh h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.02em}
.sh .sp{flex:1}
.sh small{font-size:12.5px;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}

.hint{background:#FFFCF2;border:1px solid #EDE3C6;border-radius:10px;
  padding:11px 14px;font-size:13px;color:#6A6141;margin:0 0 16px}
.hint code{background:#F2EBD8;padding:1px 5px;border-radius:4px;font-size:12px}

/* ── 고칠 수 있는 글 ────────────────────────────────────────── */
.ed{display:block;outline:none;border-radius:6px;padding:3px 6px;margin:-3px -6px;
  transition:background .15s, box-shadow .15s;min-height:1.7em;white-space:pre-wrap;
  word-break:keep-all}
.ed:hover{background:#F3F5F8}
.ed:focus{background:#fff;box-shadow:0 0 0 2px var(--accent)}
.ed:empty::before{content:attr(data-ph);color:#BFC0BA}
.ed.t-xl{font-size:26px;font-weight:600;letter-spacing:-.02em}
.ed.t-l{font-size:18px;font-weight:600}
.ed.t-m{font-size:15px}
.ed.t-s{font-size:13.5px;color:var(--soft)}
.ed.t-en{font-size:13.5px;color:var(--mute)}
.ed.mono{font-size:13px;color:var(--soft)}

.fld{margin-bottom:10px}
.fld:last-child{margin-bottom:0}
.lb{display:block;font-size:11px;letter-spacing:.06em;color:var(--mute);margin-bottom:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 18px}
@media (max-width:760px){.two,.three{grid-template-columns:1fr}}

/* ── 작품 카드 ──────────────────────────────────────────────── */
.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
.card.drop{outline:2px dashed var(--accent);outline-offset:2px}
.cardtop{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cardtop .n{font-size:12px;color:var(--mute);min-width:22px}
.cardtop .sp{flex:1}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}

/* ── 사진 타일 ──────────────────────────────────────────────── */
.strip{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start}
.tile{position:relative;width:104px;border-radius:9px;overflow:hidden;
  border:1px solid var(--line);background:#F2F2EE;cursor:grab}
.tile.drag{opacity:.4}
.tile.over{outline:2px solid var(--accent);outline-offset:1px}
.tile img{display:block;width:100%;height:104px;object-fit:contain;background:#F2F2EE}
.tile .miss{display:flex;align-items:center;justify-content:center;height:104px;
  font-size:11px;color:var(--mute);text-align:center;padding:6px;line-height:1.4}
.tile .cap{font-size:10.5px;color:var(--mute);padding:4px 6px;word-break:break-all;
  border-top:1px solid var(--hair);background:#fff}
.tile .badge{position:absolute;top:5px;left:5px;background:var(--ink);color:#fff;
  font-size:10px;padding:1px 6px;border-radius:5px}
.tile .acts{position:absolute;inset:0 0 auto 0;display:flex;gap:3px;padding:5px;
  justify-content:flex-end;opacity:0;transition:.15s;
  background:linear-gradient(rgba(0,0,0,.42),transparent)}
.tile:hover .acts{opacity:1}
.tile .acts button{border:0;background:rgba(255,255,255,.94);border-radius:5px;
  width:22px;height:22px;font-size:12px;cursor:pointer;line-height:1;padding:0;color:#191A1D}
.tile .acts button:hover{background:#fff}
.tile .acts button.x:hover{background:var(--warn);color:#fff}
.addtile{width:104px;height:104px;border:1px dashed var(--line);border-radius:9px;
  background:#FAFAF8;color:var(--mute);font-size:12px;cursor:pointer;line-height:1.4}
.addtile:hover{border-color:var(--accent);color:var(--accent)}

/* ── 사진 고르는 창 ─────────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:60;display:none;background:rgba(20,20,22,.6);
  backdrop-filter:blur(3px)}
.modal.on{display:grid;place-items:center;padding:24px}
.mbox{background:var(--card);border-radius:16px;width:min(980px,100%);max-height:86vh;
  display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:15px;font-weight:600}
.mhead .sp{flex:1}
.mbody{padding:16px 18px;overflow:auto}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.pick figure{margin:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:pointer;background:#F2F2EE}
.pick figure:hover{border-color:var(--accent)}
.pick img{display:block;width:100%;height:100px;object-fit:contain;background:#F2F2EE}
.pick figcaption{font-size:10.5px;color:var(--mute);padding:4px 6px;word-break:break-all;background:#fff}

/* ── 아래쪽 저장 막대 ───────────────────────────────────────── */
.save{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(244,244,242,.96);
  backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.sin{max-width:1180px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sin .sp{flex:1}
#status{font-size:13px;color:var(--soft)}
#status.warn{color:var(--warn)}
#status.ok{color:var(--ok)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mute);margin-right:6px}
.dot.on{background:var(--ok)}
</style>
</head>
<body>

<header>
  <div class="hin">
    <h1>홈페이지 편집기</h1>
    <span class="sp"></span>
    <button class="btn" id="folderBtn"><span class="dot" id="dot"></span>이미지 폴더 연결</button>
    <button class="btn" id="loadBtn">다른 data.js 불러오기</button>
    <input type="file" id="fileIn" accept=".js" hidden>
    <input type="file" id="dirIn" webkitdirectory directory multiple hidden>
  </div>
  <nav class="jump">
    <a href="#s-basic">기본</a><a href="#s-enter">첫 화면</a><a href="#s-about">소개</a>
    <a href="#s-works">작품</a><a href="#s-proj">건축 공간</a><a href="#s-collab">협업</a>
    <a href="#s-cv">이력</a><a href="#s-contact">연락처</a>
  </nav>
</header>

<main id="main"></main>

<div class="save">
  <div class="sin">
    <span id="status">data.js 를 불러오는 중…</span>
    <span class="sp"></span>
    <button class="btn" id="previewBtn">미리보기 열기</button>
    <button class="btn" id="copyBtn">전체 복사</button>
    <button class="btn primary" id="saveBtn">data.js 내려받기</button>
  </div>
</div>

<!-- 사진 고르는 창 -->
<div class="modal" id="modal">
  <div class="mbox">
    <div class="mhead">
      <h3>사진 고르기</h3>
      <span class="sp"></span>
      <button class="btn mini" id="mFolder">폴더 연결</button>
      <button class="btn mini" id="mFile">파일에서 고르기</button>
      <button class="btn mini" id="mClose">닫기</button>
    </div>
    <div class="mbody" id="mBody"></div>
  </div>
</div>
<input type="file" id="oneFile" accept="image/*" hidden>

<script src="data.js"></script>
<script>
(function () {
/* ==========================================================================
   보이는 그대로 고치는 편집기입니다.
   · 글자를 눌러 바로 고치세요.
   · 사진은 끌어서 순서를 바꾸고, 눌러서 바꾸거나 지웁니다.
   · 다 고쳤으면 아래 '전체 복사' → GitHub 의 data.js 에 붙여넣기 (가장 간단)
     또는 'data.js 내려받기' → 저장소의 data.js 에 덮어쓰기.
   ========================================================================== */

  var $ = function (s) { return document.querySelector(s); };
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  var D = null, changed = false, imgNames = [], urlMap = {};

  function dirty() {
    changed = true;
    var s = $('#status'); s.className = 'warn';
    s.textContent = '고친 내용이 있습니다 — 아래 «data.js 내려받기»를 눌러주세요';
  }
  function say(t, cls) { var s = $('#status'); s.className = cls || ''; s.textContent = t; }

  /* ── 글자 고치기 ──────────────────────────────────────────────── */
  function ed(obj, key, cls, ph, multi) {
    var e = el(multi ? 'div' : 'div', 'ed ' + (cls || ''));
    try { e.contentEditable = 'plaintext-only'; }
    catch (err) { e.contentEditable = 'true'; }
    e.setAttribute('data-ph', ph || '비어 있음');
    e.textContent = (obj && obj[key] != null) ? obj[key] : '';
    e.addEventListener('input', function () { obj[key] = e.textContent; dirty(); });
    e.addEventListener('keydown', function (ev) {
      if (!multi && ev.key === 'Enter') { ev.preventDefault(); e.blur(); }
    });
    e.addEventListener('paste', function (ev) {          // 글자만 붙여넣기
      ev.preventDefault();
      var t = (ev.clipboardData || window.clipboardData).getData('text');
      document.execCommand('insertText', false, t.replace(/\r/g, ''));
    });
    return e;
  }
  /* 라벨 + 고칠 수 있는 글 */
  function fld(label, obj, key, cls, ph, multi) {
    var w = el('div', 'fld');
    if (label) w.appendChild(el('span', 'lb', label));
    w.appendChild(ed(obj, key, cls, ph, multi));
    return w;
  }
  /* 국문 + 영문 한 쌍 */
  function pair(obj, labelKo, labelEn, cls, multi) {
    var g = el('div', 'two');
    g.appendChild(fld(labelKo || '국문', obj, 'ko', cls, '국문', multi));
    g.appendChild(fld(labelEn || '영문', obj, 'en', (cls || '') + ' t-en', '영문 (비워도 됩니다)', multi));
    return g;
  }

  /* ── 사진 타일 ────────────────────────────────────────────────── */
  function strip(arr, onChange) {
    var box = el('div', 'strip');
    function draw() {
      box.innerHTML = '';
      arr.forEach(function (src, i) {
        var t = el('div', 'tile');
        t.draggable = true;

        var url = urlMap[src] || src;
        if (src) {
          var im = el('img'); im.src = url; im.alt = '';
          im.onerror = function () {
            t.replaceChild(el('div', 'miss', '파일 없음<br>' + src.replace('images/', '')), im);
          };
          t.appendChild(im);
        } else {
          t.appendChild(el('div', 'miss', '비어 있음'));
        }
        if (i === 0 && arr.length > 1) t.appendChild(el('span', 'badge', '대표'));
        t.appendChild(el('div', 'cap', src ? src.replace('images/', '') : '—'));

        var acts = el('div', 'acts');
        var ch = el('button', '', '↻'); ch.title = '사진 바꾸기';
        ch.onclick = function (e) { e.stopPropagation(); openPicker(function (v) { arr[i] = v; draw(); dirty(); }); };
        var x = el('button', 'x', '×'); x.title = '빼기';
        x.onclick = function (e) { e.stopPropagation(); arr.splice(i, 1); draw(); dirty(); };
        acts.appendChild(ch); acts.appendChild(x);
        t.appendChild(acts);

        t.ondragstart = function (e) { e.dataTransfer.setData('text/plain', i); t.classList.add('drag'); };
        t.ondragend = function () { t.classList.remove('drag'); };
        t.ondragover = function (e) { e.preventDefault(); t.classList.add('over'); };
        t.ondragleave = function () { t.classList.remove('over'); };
        t.ondrop = function (e) {
          e.preventDefault(); t.classList.remove('over');
          if (e.dataTransfer.files && e.dataTransfer.files.length) {   // 파일을 끌어다 놓은 경우
            takeFile(e.dataTransfer.files[0], function (v) { arr[i] = v; draw(); dirty(); });
            return;
          }
          var from = parseInt(e.dataTransfer.getData('text/plain'), 10);
          if (isNaN(from) || from === i) return;
          var moved = arr.splice(from, 1)[0];
          arr.splice(i, 0, moved);
          draw(); dirty();
        };
        box.appendChild(t);
      });

      var add = el('button', 'addtile', '+<br>사진 추가');
      add.onclick = function () { openPicker(function (v) { arr.push(v); draw(); dirty(); }); };
      add.ondragover = function (e) { e.preventDefault(); add.style.borderColor = '#2B4A6F'; };
      add.ondragleave = function () { add.style.borderColor = ''; };
      add.ondrop = function (e) {
        e.preventDefault(); add.style.borderColor = '';
        if (e.dataTransfer.files && e.dataTransfer.files.length)
          takeFile(e.dataTransfer.files[0], function (v) { arr.push(v); draw(); dirty(); });
      };
      box.appendChild(add);
      if (onChange) onChange();
    }
    draw();
    box.redraw = draw;
    return box;
  }

  /* 끌어다 놓은 파일을 받아 경로로 바꿉니다 */
  function takeFile(file, cb) {
    if (!file || !/^image\//.test(file.type)) return;
    var v = 'images/' + file.name;
    urlMap[v] = URL.createObjectURL(file);
    cb(v);
    say('«' + file.name + '» 을 넣었습니다. 이 파일을 images 폴더에도 복사해 두세요.', 'warn');
  }

  /* ── 사진 고르는 창 ───────────────────────────────────────────── */
  var pickCb = null;
  function openPicker(cb) {
    pickCb = cb;
    var body = $('#mBody');
    body.innerHTML = '';
    if (!imgNames.length) {
      body.appendChild(el('p', 'hint',
        '<b>이미지 폴더를 연결하면</b> 갖고 있는 사진을 여기서 눈으로 고를 수 있습니다.<br>' +
        '위의 «폴더 연결» 을 누르고 <code>images</code> 폴더를 선택하세요. ' +
        '(파일이 어디로 올라가지 않습니다. 이름만 읽습니다.)<br><br>' +
        '또는 «파일에서 고르기» 로 한 장씩 고르셔도 됩니다.'));
    } else {
      var g = el('div', 'pick');
      imgNames.forEach(function (n) {
        var f = el('figure');
        var im = el('img'); im.src = urlMap['images/' + n] || ('images/' + n); im.alt = n;
        f.appendChild(im); f.appendChild(el('figcaption', '', n));
        f.onclick = function () { close(); if (pickCb) pickCb('images/' + n); };
        g.appendChild(f);
      });
      body.appendChild(g);
    }
    $('#modal').classList.add('on');
  }
  function close() { $('#modal').classList.remove('on'); }
  $('#mClose').onclick = close;
  $('#modal').onclick = function (e) { if (e.target === $('#modal')) close(); };
  $('#mFile').onclick = function () { $('#oneFile').click(); };
  $('#oneFile').onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    takeFile(f, function (v) { close(); if (pickCb) pickCb(v); });
    e.target.value = '';
  };
  $('#mFolder').onclick = function () { $('#dirIn').click(); };
  $('#folderBtn').onclick = function () { $('#dirIn').click(); };
  $('#dirIn').onchange = function (e) {
    var fs = Array.prototype.slice.call(e.target.files);
    imgNames = [];
    fs.forEach(function (f) {
      if (!/\.(jpe?g|png|webp|gif)$/i.test(f.name)) return;
      imgNames.push(f.name);
      urlMap['images/' + f.name] = URL.createObjectURL(f);
    });
    imgNames.sort();
    $('#dot').classList.add('on');
    $('#folderBtn').lastChild.nodeValue = '사진 ' + imgNames.length + '장 연결됨';
    say('이미지 폴더를 연결했습니다 — 사진 ' + imgNames.length + '장', 'ok');
    build();
    if ($('#modal').classList.contains('on')) openPicker(pickCb);
  };

  /* ── 화면 만들기 ──────────────────────────────────────────────── */
  function sec(id, title, note) {
    var s = el('section'); s.id = id;
    var h = el('div', 'sh');
    h.appendChild(el('h2', '', title));
    h.appendChild(el('span', 'sp'));
    if (note) h.appendChild(el('small', '', note));
    s.appendChild(h);
    return s;
  }
  function rowbtns(arr, i, redraw, label) {
    var f = document.createDocumentFragment();
    var up = el('button', 'btn mini', '↑'); up.onclick = function () { if (i > 0) { arr.splice(i - 1, 0, arr.splice(i, 1)[0]); redraw(); dirty(); } };
    var dn = el('button', 'btn mini', '↓'); dn.onclick = function () { if (i < arr.length - 1) { arr.splice(i + 1, 0, arr.splice(i, 1)[0]); redraw(); dirty(); } };
    var rm = el('button', 'btn mini danger', '삭제');
    rm.onclick = function () { if (confirm((label || '이 항목') + ' 을(를) 지울까요?')) { arr.splice(i, 1); redraw(); dirty(); } };
    f.appendChild(up); f.appendChild(dn); f.appendChild(rm);
    return f;
  }

  function build() {
    var m = $('#main'); m.innerHTML = '';

    m.appendChild(el('p', 'hint',
      '<b>글자를 바로 누르면 고칠 수 있습니다.</b> 사진은 끌어서 순서를 바꾸고, ' +
      '사진 위 <b>↻</b> 로 바꾸거나 <b>×</b> 로 뺍니다. 컴퓨터에 있는 사진을 타일 위로 ' +
      '끌어다 놓아도 됩니다.<br>다 고치면 아래 «data.js 내려받기» 를 누르고, 받은 파일을 ' +
      '저장소의 <code>data.js</code> 자리에 덮어쓰면 끝입니다.'));

    /* 기본 */
    var s1 = sec('s-basic', '기본');
    var p1 = el('div', 'panel');
    p1.appendChild(pair(D.meta.name, '이름 (국문)', '이름 (영문)', 't-l'));
    p1.appendChild(pair(D.meta.role, '직함 (국문)', '직함 (영문)', 't-m'));
    p1.appendChild(pair(D.meta.media, '매체 (국문)', '매체 (영문)', 't-s'));
    var g = el('div', 'two');
    g.appendChild(fld('활동 기간', D.meta, 'span', 't-s', '2016 — 2025'));
    g.appendChild(fld('브라우저 탭 제목', D.meta, 'title', 't-s'));
    p1.appendChild(g);
    p1.appendChild(pair(D.meta.studio, '스튜디오 (국문)', '스튜디오 (영문)', 't-s'));
    s1.appendChild(p1); m.appendChild(s1);

    /* 첫 화면 */
    var s2 = sec('s-enter', '첫 화면');
    var p2 = el('div', 'panel');
    p2.appendChild(fld('큰 글씨', D.entrance, 'name', 't-xl', 'BAE JIN HEE'));
    p2.appendChild(pair(D.entrance.line, '한 줄 소개 (국문)', '한 줄 소개 (영문)', 't-m', true));
    p2.appendChild(fld('아래쪽 안내 문구', D.entrance, 'cue', 't-s', 'SCROLL'));
    s2.appendChild(p2); m.appendChild(s2);

    /* 소개 */
    var s3 = sec('s-about', '소개');
    var p3 = el('div', 'panel');
    var ag = el('div', 'grid2');
    var left = el('div');
    left.appendChild(el('span', 'lb', '작가 사진'));
    var pa = { images: [D.about.portrait] };
    var ps = strip(pa.images, function () { D.about.portrait = pa.images[0] || ''; });
    left.appendChild(ps);
    ag.appendChild(left);
    var right = el('div');
    right.appendChild(pair(D.about.heading, '구역 제목 (국문)', '구역 제목 (영문)', 't-m'));
    ag.appendChild(right);
    p3.appendChild(ag);
    var paras = el('div');
    function drawParas() {
      paras.innerHTML = '';
      paras.appendChild(el('span', 'lb', '소개 문단'));
      D.about.paragraphs.forEach(function (p, i) {
        var c = el('div', 'card');
        var t = el('div', 'cardtop');
        t.appendChild(el('span', 'n', (i + 1) + '.'));
        t.appendChild(el('span', 'sp'));
        t.appendChild(rowbtns(D.about.paragraphs, i, drawParas, '이 문단'));
        c.appendChild(t);
        c.appendChild(pair(p, '국문', '영문', 't-s', true));
        paras.appendChild(c);
      });
      var a = el('button', 'btn mini', '+ 문단 추가');
      a.onclick = function () { D.about.paragraphs.push({ ko: '', en: '' }); drawParas(); dirty(); };
      paras.appendChild(a);
    }
    drawParas();
    p3.appendChild(paras);
    s3.appendChild(p3); m.appendChild(s3);

    /* 작품 */
    var s4 = sec('s-works', '작품', '연작 · 작품 · 전시 전경');
    D.series.forEach(function (ser, si) {
      var p = el('div', 'panel');
      p.style.marginBottom = '14px';
      var t = el('div', 'cardtop');
      t.appendChild(el('span', 'n', '연작'));
      t.appendChild(el('span', 'sp'));
      t.appendChild(rowbtns(D.series, si, function () { build(); }, '연작 «' + ser.ko + '»'));
      p.appendChild(t);

      var gg = el('div', 'three');
      gg.appendChild(fld('연작 이름 (국문)', ser, 'ko', 't-l'));
      gg.appendChild(fld('연작 이름 (영문)', ser, 'en', 't-m t-en'));
      gg.appendChild(fld('기간', ser, 'years', 't-s', '2019 — 2023'));
      p.appendChild(gg);
      p.appendChild(pair(ser.note, '서문 (국문)', '서문 (영문)', 't-s', true));

      /* 작품 목록 */
      var wbox = el('div');
      function drawWorks() {
        wbox.innerHTML = '';
        wbox.appendChild(el('span', 'lb', '작품 ' + ser.works.length + '점'));
        ser.works.forEach(function (w, wi) {
          if (!w.images) w.images = w.image ? [w.image] : [];
          var c = el('div', 'card');
          var ct = el('div', 'cardtop');
          ct.appendChild(el('span', 'n', (wi + 1) + '.'));
          ct.appendChild(el('span', 'sp'));
          ct.appendChild(rowbtns(ser.works, wi, drawWorks, '«' + (w.ko || w.title) + '»'));
          c.appendChild(ct);
          var g2 = el('div', 'grid2');
          var L = el('div');
          L.appendChild(strip(w.images));
          var R = el('div');
          R.appendChild(fld('제목 (영문)', w, 'title', 't-m'));
          R.appendChild(fld('제목 (국문)', w, 'ko', 't-s', '없으면 비워두세요'));
          R.appendChild(fld('재료', w, 'medium', 't-s', 'glass fusing, glass painting'));
          var g3 = el('div', 'two');
          g3.appendChild(fld('크기', w, 'size', 't-s', '70 × 100 cm'));
          g3.appendChild(fld('연도', w, 'year', 't-s', '2019'));
          R.appendChild(g3);
          g2.appendChild(L); g2.appendChild(R);
          c.appendChild(g2);
          wbox.appendChild(c);
        });
        var a = el('button', 'btn mini', '+ 작품 추가');
        a.onclick = function () {
          ser.works.push({ title: '', ko: '', medium: '', size: '', year: '', images: [] });
          drawWorks(); dirty();
        };
        wbox.appendChild(a);
      }
      drawWorks(); p.appendChild(wbox);

      /* 전시 전경 */
      if (!ser.views) ser.views = [];
      var vbox = el('div'); vbox.style.marginTop = '16px';
      function drawViews() {
        vbox.innerHTML = '';
        vbox.appendChild(el('span', 'lb', '전시 전경 ' + ser.views.length + '장'));
        ser.views.forEach(function (v, vi) {
          if (!v.caption) v.caption = { ko: '', en: '' };
          var c = el('div', 'card');
          var ct = el('div', 'cardtop');
          ct.appendChild(el('span', 'n', (vi + 1) + '.'));
          ct.appendChild(el('span', 'sp'));
          ct.appendChild(rowbtns(ser.views, vi, drawViews, '이 전경'));
          c.appendChild(ct);
          var g2 = el('div', 'grid2');
          var holder = { images: [v.image] };
          var L = el('div');
          L.appendChild(strip(holder.images, function () { v.image = holder.images[0] || ''; }));
          var R = el('div');
          R.appendChild(pair(v.caption, '캡션 (국문)', '캡션 (영문)', 't-s', true));
          g2.appendChild(L); g2.appendChild(R);
          c.appendChild(g2);
          vbox.appendChild(c);
        });
        var a = el('button', 'btn mini', '+ 전경 추가');
        a.onclick = function () { ser.views.push({ image: '', caption: { ko: '', en: '' } }); drawViews(); dirty(); };
        vbox.appendChild(a);
      }
      drawViews(); p.appendChild(vbox);
      s4.appendChild(p);
    });
    var addSer = el('button', 'btn mini', '+ 연작 추가');
    addSer.onclick = function () {
      D.series.push({ id: 'series' + (D.series.length + 1), ko: '새 연작', en: '', years: '',
        note: { ko: '', en: '' }, works: [], views: [] });
      build(); dirty();
    };
    s4.appendChild(addSer);
    m.appendChild(s4);

    /* 건축 공간 · 협업 */
    [['s-proj', '건축 공간', D.projects, '장소'], ['s-collab', '협업', D.collab, '역할·장소']]
      .forEach(function (cfg) {
        var id = cfg[0], title = cfg[1], G = cfg[2], placeLabel = cfg[3];
        if (!G) return;
        var s = sec(id, title);
        var p = el('div', 'panel');
        p.appendChild(pair(G.heading, '구역 제목 (국문)', '구역 제목 (영문)', 't-m'));
        p.appendChild(pair(G.note, '설명 (국문)', '설명 (영문)', 't-s', true));
        var box = el('div'); box.style.marginTop = '14px';
        function draw() {
          box.innerHTML = '';
          box.appendChild(el('span', 'lb', title + ' ' + G.items.length + '건'));
          G.items.forEach(function (w, i) {
            if (!w.images) w.images = [];
            if (!w.place) w.place = { ko: '', en: '' };
            var c = el('div', 'card');
            var ct = el('div', 'cardtop');
            ct.appendChild(el('span', 'n', (i + 1) + '.'));
            ct.appendChild(el('span', 'sp'));
            ct.appendChild(rowbtns(G.items, i, draw, '«' + (w.ko || w.title) + '»'));
            c.appendChild(ct);
            var g2 = el('div', 'grid2');
            var L = el('div'); L.appendChild(strip(w.images));
            var R = el('div');
            R.appendChild(fld('제목 (영문)', w, 'title', 't-m'));
            R.appendChild(fld('제목 (국문)', w, 'ko', 't-s', '없으면 비워두세요'));
            R.appendChild(fld(placeLabel + ' (국문)', w.place, 'ko', 't-s'));
            R.appendChild(fld(placeLabel + ' (영문)', w.place, 'en', 't-s t-en'));
            R.appendChild(fld('연도', w, 'year', 't-s', '2025'));
            g2.appendChild(L); g2.appendChild(R);
            c.appendChild(g2);
            box.appendChild(c);
          });
          var a = el('button', 'btn mini', '+ 추가');
          a.onclick = function () {
            G.items.push({ title: '', ko: '', place: { ko: '', en: '' }, year: '', images: [] });
            draw(); dirty();
          };
          box.appendChild(a);
        }
        draw(); p.appendChild(box);
        s.appendChild(p); m.appendChild(s);
      });

    /* 이력 */
    var s6 = sec('s-cv', '이력');
    var p6 = el('div', 'panel');
    p6.appendChild(pair(D.bio.heading, '구역 제목 (국문)', '구역 제목 (영문)', 't-m'));
    p6.appendChild(pair(D.bio.born, '출생 (국문)', '출생 (영문)', 't-s'));
    var cvbox = el('div'); cvbox.style.marginTop = '14px';
    function drawCv() {
      cvbox.innerHTML = '';
      D.bio.cv.forEach(function (b, bi) {
        var c = el('div', 'card');
        var ct = el('div', 'cardtop');
        ct.appendChild(el('span', 'n', '묶음'));
        ct.appendChild(el('span', 'sp'));
        ct.appendChild(rowbtns(D.bio.cv, bi, drawCv, '묶음 «' + b.heading.ko + '»'));
        c.appendChild(ct);
        c.appendChild(pair(b.heading, '묶음 이름 (국문)', '묶음 이름 (영문)', 't-l'));
        var rows = el('div'); rows.style.marginTop = '10px';
        function drawRows() {
          rows.innerHTML = '';
          b.items.forEach(function (it, ii) {
            if (!it.sub) it.sub = { ko: '', en: '' };
            var r = el('div', 'card'); r.style.background = '#FAFAF8';
            var rt = el('div', 'cardtop');
            rt.appendChild(el('span', 'n', (ii + 1) + '.'));
            rt.appendChild(el('span', 'sp'));
            rt.appendChild(rowbtns(b.items, ii, drawRows, '이 줄'));
            r.appendChild(rt);
            r.appendChild(fld('연도', it, 'year', 't-s', '2024'));
            r.appendChild(pair(it, '내용 (국문)', '내용 (영문)', 't-s', true));
            r.appendChild(pair(it.sub, '아랫줄 (국문)', '아랫줄 (영문)', 't-en'));
            r.appendChild(fld('링크 (논문 등)', it, 'url', 'mono', 'https://... — 없으면 비워두세요'));
            rows.appendChild(r);
          });
          var a = el('button', 'btn mini', '+ 줄 추가');
          a.onclick = function () { b.items.push({ year: '', ko: '', en: '', sub: { ko: '', en: '' }, url: '' }); drawRows(); dirty(); };
          rows.appendChild(a);
        }
        drawRows(); c.appendChild(rows);
        cvbox.appendChild(c);
      });
      var a = el('button', 'btn mini', '+ 묶음 추가');
      a.onclick = function () { D.bio.cv.push({ heading: { ko: '새 묶음', en: '' }, items: [] }); drawCv(); dirty(); };
      cvbox.appendChild(a);
    }
    drawCv(); p6.appendChild(cvbox);
    s6.appendChild(p6); m.appendChild(s6);

    /* 연락처 */
    var s7 = sec('s-contact', '연락처');
    var p7 = el('div', 'panel');
    p7.appendChild(pair(D.contact.intro, '안내 문구 (국문)', '안내 문구 (영문)', 't-s', true));
    var cg = el('div', 'two');
    cg.appendChild(fld('이메일', D.contact, 'email', 'mono'));
    cg.appendChild(fld('인스타그램 아이디 (@ 없이)', D.contact, 'instagram', 'mono'));
    cg.appendChild(fld('전화번호 (비워두면 안 보입니다)', D.contact, 'phone', 'mono'));
    cg.appendChild(fld('포트폴리오 PDF 경로', D.contact, 'portfolio', 'mono', 'files/portfolio.pdf'));
    p7.appendChild(cg);
    p7.appendChild(fld('메일 받을 주소 (formspree)', D.contact, 'formEndpoint', 'mono',
      '비워두면 방문자의 메일 앱이 열립니다'));
    s7.appendChild(p7); m.appendChild(s7);
  }

  /* ── 저장 ─────────────────────────────────────────────────────── */
  /* 비어 있는 선택 항목(아랫줄·링크)은 저장할 때 덜어냅니다 */
  function tidy(x) {
    if (Array.isArray(x)) return x.map(tidy);
    if (x && typeof x === 'object') {
      var o = {};
      Object.keys(x).forEach(function (k) {
        var v = x[k];
        if (k === 'url' && v === '') return;
        if (k === 'sub' && v && !String(v.ko || '').trim() && !String(v.en || '').trim()) return;
        o[k] = tidy(v);
      });
      return o;
    }
    return x;
  }

  function serialize() {
    return '/* ==========================================================================\n' +
      '   data.js — 홈페이지 내용\n' +
      '   편집기(편집기.html)로 저장한 파일입니다. 직접 고치셔도 됩니다.\n' +
      '   마지막 수정: ' + new Date().toLocaleString('ko-KR') + '\n' +
      '   ========================================================================== */\n\n' +
      'const SITE = ' + JSON.stringify(tidy(D), null, 2) + ';\n';
  }
  $('#saveBtn').onclick = function () {
    var b = new Blob([serialize()], { type: 'text/javascript;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'data.js'; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    changed = false;
    say('내려받았습니다. 이 파일을 저장소의 data.js 자리에 덮어쓰세요.', 'ok');
  };
  /* 내려받기가 막히는 환경(브라우저가 file:// 다운로드를 차단할 때)을 위한 길 */
  $('#copyBtn').onclick = function () {
    var t = serialize();
    function done() {
      changed = false;
      say('복사했습니다. GitHub 의 data.js 를 열어 전체 선택(Ctrl+A) 후 붙여넣으세요.', 'ok');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, fallback);
    } else fallback();

    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = t;
      ta.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (ok) done();
      else say('복사하지 못했습니다. 브라우저 주소창을 누르고 Ctrl+V 로 확인해 보세요.', 'warn');
    }
  };

  $('#previewBtn').onclick = function () { window.open('index.html', '_blank'); };

  $('#loadBtn').onclick = function () { $('#fileIn').click(); };
  $('#fileIn').onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var txt = r.result.replace(/^[\s\S]*?const\s+SITE\s*=/, '').replace(/;\s*$/, '');
        D = new Function('return (' + txt + ')')();
        build(); say(f.name + ' 을(를) 불러왔습니다.', 'ok');
      } catch (err) { alert('파일을 읽지 못했습니다.\n' + err.message); }
    };
    r.readAsText(f, 'utf-8');
  };

  window.addEventListener('beforeunload', function (e) {
    if (changed) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ── 시작 ─────────────────────────────────────────────────────── */
  if (typeof SITE !== 'undefined') {
    D = JSON.parse(JSON.stringify(SITE));
    build();
    say('글자를 눌러 고치세요. 사진은 끌어서 순서를 바꿉니다.');
  } else {
    $('#main').innerHTML = '<p class="hint">data.js 를 찾지 못했습니다. ' +
      '이 파일(편집기.html)을 index.html · data.js 와 같은 폴더에 두고 여세요. ' +
      '또는 위의 «다른 data.js 불러오기» 로 직접 선택하셔도 됩니다.</p>';
    say('data.js 를 찾지 못했습니다', 'warn');
  }
})();
</script>
